name: Aura 3D Live Rig Build

on:
  workflow_dispatch:
  push:
    branches:
      - video-generation-suite
    paths:
      - .github/workflows/aura-3d-live-build.yml
      - data/aura_character_references/front.b64
      - scripts/aura_3d/hf_anigen_generate.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aura-3d-live-build.yml
      - data/aura_character_references/front.b64
      - scripts/aura_3d/hf_anigen_generate.py

permissions:
  contents: write

concurrency:
  group: aura-3d-live-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-aura-rig:
    name: Generate real rigged Aura GLB
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout private development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: video-generation-suite

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hosted 3D client
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade gradio_client

      - name: Decode canonical Aura build reference
        run: |
          mkdir -p data/aura_character_references
          python - <<'PY'
          import base64
          from pathlib import Path
          source = Path('data/aura_character_references/front.b64')
          target = Path('data/aura_character_references/front.jpg')
          target.write_bytes(base64.b64decode(source.read_text(encoding='utf-8').strip(), validate=True))
          assert target.stat().st_size > 4096
          print(f'Decoded Aura reference: {target} ({target.stat().st_size} bytes)')
          PY

      - name: Generate Aura rig through AniGen ZeroGPU
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p aura_music_studio/static/aura/builds data/aura_3d_build
          python scripts/aura_3d/hf_anigen_generate.py \
            --input data/aura_character_references/front.jpg \
            --output aura_music_studio/static/aura/builds/aura_anigen_rigged.glb \
            --metadata data/aura_3d_build/aura_anigen_rigged.json

      - name: Verify GLB build outputs
        run: |
          test -s aura_music_studio/static/aura/builds/aura_anigen_rigged.glb
          test -s data/aura_3d_build/aura_anigen_rigged.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('data/aura_3d_build/aura_anigen_rigged.json').read_text())
          assert meta['status'] == 'rigged_intermediate_ready'
          assert meta['skins'] >= 1
          assert meta['joint_nodes'] >= 15
          assert meta['skinned_nodes'] >= 1
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload rigged GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AniGen-rigged-GLB
          if-no-files-found: error
          retention-days: 30
          path: |
            aura_music_studio/static/aura/builds/aura_anigen_rigged.glb
            data/aura_3d_build/aura_anigen_rigged.json
            data/aura_3d_build/anigen_api.json

      - name: Commit verified rigged intermediate to private branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'Aura 3D Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            aura_music_studio/static/aura/builds/aura_anigen_rigged.glb \
            data/aura_3d_build/aura_anigen_rigged.json \
            data/aura_3d_build/anigen_api.json
          if git diff --cached --quiet; then
            echo 'No generated asset change to commit.'
          else
            git commit -m 'build(aura): generate real AniGen rigged GLB'
            git push origin HEAD:video-generation-suite
          fi
