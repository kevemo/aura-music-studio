name: Pulsar-Frequency House CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsar-frequency-house-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests + deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: System audio and self-host tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 miniupnpc

      - name: Install Pulsar-Frequency core + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python
        run: python -m compileall -q aura_music_studio

      - name: Run test suite
        run: python -m pytest -q -ra

      - name: Self-host Compose validation
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile public config -q
          docker compose --profile social-publishing config -q

      - name: Self-hosted ACE-Step renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

      - name: Optional YuE renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.yue.yml config -q

      - name: Combined ACE-Step + YuE renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.yue.yml config -q

      - name: ESP compute-node Compose validation
        run: |
          cat > .env.node <<'EOF'
          LSS_NODE_COORDINATOR_URL=http://127.0.0.1:8000
          LSS_NODE_ID=ci-node
          LSS_NODE_SECRET=ci-placeholder-not-a-production-secret
          LSS_NODE_NAME=CI Node
          LSS_NODE_CAPABILITIES=music_generation,engineering
          EOF
          docker compose -f docker-compose.node.yml config -q
          rm -f .env.node

      - name: Caddy configuration validation
        run: |
          docker run --rm \
            -e LSS_PUBLIC_SITE_ADDRESS=http://:80 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Real-audio safety smoke test
        run: |
          python - <<'PY'
          from aura_music_studio.models import ProjectManifest, RendererConfig
          from aura_music_studio.renderer_runtime import probe_real_audio
          from pathlib import Path

          try:
              ProjectManifest(
                  project_name='bad',
                  title='bad',
                  rights_confirmed=True,
                  renderer=RendererConfig(
                      require_real_audio=True,
                      allow_symbolic_guide_as_final=True,
                  ),
              )
          except ValueError:
              print('PASS: symbolic guide cannot become final master')
          else:
              raise SystemExit('FAIL: real-audio guard was bypassed')

          symbolic = Path('ci_symbolic.mid')
          symbolic.write_bytes(b'MThd\\x00\\x00\\x00\\x06')
          if probe_real_audio(symbolic).valid:
              raise SystemExit('FAIL: symbolic file passed the renderer waveform probe')
          symbolic.unlink()
          print('PASS: renderer waveform probe rejects symbolic controls')
          PY
