name: Elevate Souls Command Center CI

on:
  push:
    branches: [main, development/full-site-build]
  pull_request:
    branches: [main, development/full-site-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elevate-souls-command-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests + deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: System audio and self-host tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 miniupnpc

      - name: Install Command Center core + dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Production source completeness audit
        run: python scripts/source_completeness_audit.py

      - name: Compile Python
        run: python -m compileall -q aura_music_studio scripts

      - name: Authoritative self-host release contract
        run: python scripts/validate_selfhost_release_contract.py

      - name: Run test suite
        run: python -m pytest -q -ra

      - name: Isolated backup restore drill
        run: |
          python scripts/run_restore_drill.py \
            --environment ci \
            --output /tmp/chat10-restore-evidence.json
          python - <<'PY'
          import json
          evidence = json.load(open('/tmp/chat10-restore-evidence.json', encoding='utf-8'))
          assert evidence['result'] == 'verified'
          assert evidence['database_integrity'] == 'ok'
          assert evidence['application_data_check'] is True
          assert evidence['backup_hashes_verified'] is True
          assert evidence['production_backup_used'] is False
          print('PASS: isolated restore mechanism verified; no production-backup claim made')
          PY

      - name: Upload restore drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat10-restore-drill-evidence
          path: /tmp/chat10-restore-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Self-host Compose validation
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile public config -q
          docker compose --profile social-publishing config -q

      - name: Self-hosted ACE-Step renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

      - name: Optional YuE renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.yue.yml config -q

      - name: Combined ACE-Step + YuE renderer topology validation
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.yue.yml config -q

      - name: Staging deployment topology validation
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            config -q
          ACESTEP_API_KEY=ci-staging-renderer-key-0123456789 docker compose \
            -f docker-compose.yml \
            -f docker-compose.gpu.yml \
            -f deploy/staging/docker-compose.staging.yml \
            config -q

      - name: Production deployment topology validation
        run: |
          LSS_DEPLOYMENT_MODE=selfhost \
          LSS_PUBLIC_SITE_ADDRESS=https://ci.example.test \
          ACESTEP_API_KEY=ci-production-renderer-key-0123456789 \
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.gpu.yml \
            -f deploy/production/docker-compose.production.yml \
            config -q
          LSS_DEPLOYMENT_MODE=selfhost \
          LSS_PUBLIC_SITE_ADDRESS=https://ci.example.test \
          ACESTEP_API_KEY=ci-production-renderer-key-0123456789 \
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.gpu.yml \
            -f deploy/production/docker-compose.production.yml \
            --profile public config -q

      - name: Production configuration fail-closed smoke
        run: |
          env \
            AURA_DEPLOYMENT_ENV=production \
            LSS_DEPLOYMENT_MODE=selfhost \
            LSS_PAYMENT_PROVIDER=paypal \
            LSS_PAYMENT_MODE=verified_paypal_webhook \
            LSS_PAYPAL_ENVIRONMENT=live \
            LSS_PAYPAL_CLIENT_ID=ci-paypal-client-0123456789 \
            LSS_PAYPAL_CLIENT_SECRET=test-only-paypal-secret-0123456789 \
            LSS_PAYPAL_WEBHOOK_ID=ci-paypal-webhook-0123456789 \
            AURA_GPU_REQUIRED=true \
            AURA_REQUIRE_LIVE_RENDERER=true \
            AURA_ACESTEP_API_URL=http://ace-step:8001 \
            ACESTEP_API_KEY=ci-renderer-secret-0123456789 \
            AURA_MONITORING_ENABLED=true \
            AURA_MONITORING_TOKEN=ci-monitoring-secret-0123456789 \
            LSS_AUTO_BACKUP_ENABLED=true \
            LSS_AUTO_BACKUP_INTERVAL_HOURS=12 \
            LSS_AUTO_BACKUP_KEEP=14 \
            LSS_BACKUP_AGE_RECIPIENT=age1ci0123456789012345678901234567890 \
            LSS_RESTORE_EVIDENCE_PATH=/tmp/chat10-restore-evidence.json \
            LSS_PUBLIC_BASE_URL=https://ci.example.test \
            LSS_PUBLIC_SITE_ADDRESS=https://ci.example.test \
            LSS_COOKIE_SECURE=true \
            LSS_PROVENANCE_SECRET=ci-provenance-secret-0123456789 \
            LSS_ADMIN_KEY=ci-owner-secret-0123456789 \
            AURA_WEB_ALLOW_HTTP=false \
            LSS_DB_PATH=/app/data/live_sound_studio.sqlite3 \
            AURA_PROJECTS_ROOT=/app/projects \
            LSS_BACKUP_DIR=/app/backups \
            python -m aura_music_studio.production_readiness > /tmp/aura-production-readiness.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/aura-production-readiness.json', encoding='utf-8'))
          if not report.get('configuration_ready') or report.get('secret_values_exposed'):
              raise SystemExit(f'FAIL: production configuration readiness smoke failed: {report}')
          restore = report['categories']['restore_evidence']
          if restore['ok']:
              raise SystemExit('FAIL: synthetic CI restore must never satisfy production restore evidence')
          if not restore['details'].get('mechanism_verified'):
              raise SystemExit(f'FAIL: CI restore mechanism evidence was not recognized: {restore}')
          if restore['details'].get('production_backup_used'):
              raise SystemExit(f'FAIL: synthetic CI evidence falsely claims production-backup use: {restore}')
          if report.get('production_ready'):
              raise SystemExit('FAIL: config-only CI must never claim deployed production readiness')
          blockers = set(report.get('release_blocking_categories') or [])
          if blockers != {'runtime_dependencies', 'restore_evidence'}:
              raise SystemExit(f"FAIL: expected runtime + production-restore blockers: {report['release_blocking_categories']}")
          print('PASS: config and restore mechanism are valid; deployed runtime and real production restore remain explicitly unverified')
          PY

      - name: ESP compute-node Compose validation
        run: |
          cat > .env.node <<'EOF'
          LSS_NODE_COORDINATOR_URL=http://127.0.0.1:8000
          LSS_NODE_ID=ci-node
          LSS_NODE_SECRET=ci-placeholder-not-a-production-secret
          LSS_NODE_NAME=CI Node
          LSS_NODE_CAPABILITIES=music_generation,engineering
          EOF
          docker compose -f docker-compose.node.yml config -q
          rm -f .env.node

      - name: Caddy configuration validation
        run: |
          docker run --rm \
            -e LSS_PUBLIC_SITE_ADDRESS=https://ci.example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Real-audio safety smoke test
        run: |
          python - <<'PY'
          from aura_music_studio.models import ProjectManifest, RendererConfig
          from aura_music_studio.renderer_runtime import probe_real_audio
          from pathlib import Path

          try:
              ProjectManifest(
                  project_name='bad',
                  title='bad',
                  rights_confirmed=True,
                  renderer=RendererConfig(
                      require_real_audio=True,
                      allow_symbolic_guide_as_final=True,
                  ),
              )
          except ValueError:
              print('PASS: symbolic guide cannot become final master')
          else:
              raise SystemExit('FAIL: real-audio guard was bypassed')

          symbolic = Path('ci_symbolic.mid')
          symbolic.write_bytes(b'MThd\\x00\\x00\\x00\\x06')
          if probe_real_audio(symbolic).valid:
              raise SystemExit('FAIL: symbolic file passed the renderer waveform probe')
          symbolic.unlink()
          print('PASS: renderer waveform probe rejects symbolic controls')
          PY
