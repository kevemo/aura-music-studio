name: Probe ACE-Step Space API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Gradio client
        run: pip install --quiet --upgrade gradio_client
      - name: Inspect ACE-Step target endpoints
        run: |
          mkdir -p generated
          python - <<'PY' > generated/ace_api.txt
          from gradio_client import Client
          c = Client("ACE-Step/Ace-Step-v1.5")
          print("SRC", c.src)
          for ep in c.endpoints.values():
              api = getattr(ep, "api_name", None)
              if api == "/generation_wrapper":
                  print("API", api, "FN", getattr(ep, "fn_index", None))
                  print("PARAM_COUNT", len(ep.parameters_info))
                  for i,p in enumerate(ep.parameters_info):
                      print("P", i, "name=", p.get("parameter_name"), "label=", repr(p.get("label")), "has_default=", p.get("parameter_has_default"), "default=", repr(p.get("parameter_default")), "component=", p.get("component"), "python_type=", repr(p.get("python_type")))
                  dep = ep.dependency
                  print("OUTPUT_IDS", dep.get("outputs"))
                  print("OUTPUT_COUNT", len(dep.get("outputs", [])))
          PY
      - name: Upload probe result for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ace-step-probe
          path: generated/ace_api.txt
          if-no-files-found: error
          retention-days: 14
