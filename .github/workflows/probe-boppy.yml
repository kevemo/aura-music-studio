name: Probe Boppy Anonymous ACE-Step Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-boppy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Boppy frontend generation call
        run: |
          mkdir -p generated/boppy
          python - <<'PY'
          import re, requests, urllib.parse, pathlib
          base='https://boppy.me'
          out=pathlib.Path('generated/boppy')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          html=s.get(base+'/', timeout=30).text
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
          chunks=[]
          for src in srcs:
              url=urllib.parse.urljoin(base,src)
              txt=s.get(url,timeout=30).text
              needles=['/api/v2/audio/music','deapi.ai','generateTrack','request_id','Authorization','Bearer','x-api-key','api_key']
              for needle in needles:
                  start=0
                  while True:
                      j=txt.find(needle,start)
                      if j<0: break
                      lo=max(0,j-1800); hi=min(len(txt),j+2600)
                      chunks.append(f'\n===== {url} :: {needle} @ {j} =====\n'+txt[lo:hi])
                      start=j+len(needle)
                      if sum(1 for x in chunks if f':: {needle} @' in x)>=8: break
          (out/'contexts.txt').write_text('\n'.join(chunks),encoding='utf-8')
          print('contexts',len(chunks))
          PY
      - name: Commit probe
        run: |
          git config user.name "Aura Music Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/boppy/contexts.txt
          git commit -m "Inspect Boppy generation request context" || exit 0
          git push
