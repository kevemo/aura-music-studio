name: Probe Boppy Anonymous ACE-Step Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-boppy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find Boppy generate payload construction
        run: |
          mkdir -p generated/boppy
          python - <<'PY'
          import re, requests, urllib.parse, pathlib
          base='https://boppy.me'; out=pathlib.Path('generated/boppy')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          html=s.get(base+'/',timeout=30).text
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html)
          chunks=[]
          for src in srcs:
              url=urllib.parse.urljoin(base,src); txt=s.get(url,timeout=30).text
              for pat in [r'(?<!function )\bik\(', r'\bok\(', r'jobId', r'inference_steps', r'guidance_scale', r'key_scale', r'time_signature']:
                  for m in list(re.finditer(pat,txt))[:20]:
                      j=m.start(); lo=max(0,j-1800); hi=min(len(txt),j+3200)
                      chunks.append(f'\n===== {pat} {url} @ {j} =====\n'+txt[lo:hi])
          (out/'payload_contexts.txt').write_text('\n'.join(chunks),encoding='utf-8')
          print('captured',len(chunks))
          PY
      - name: Commit probe
        run: |
          git config user.name "Aura Music Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/boppy/payload_contexts.txt
          git commit -m "Inspect Boppy generate payload" || exit 0
          git push
