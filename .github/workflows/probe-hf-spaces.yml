name: Probe Alternate ACE-Step Spaces

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hf-spaces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --upgrade gradio_client
      - name: Probe endpoint schemas
        run: |
          mkdir -p generated/hf_spaces
          python - <<'PY' > generated/hf_spaces/endpoints.txt
          from gradio_client import Client
          spaces=['LububMusicAi/ACE-Step-Custom','WojteKris/ace-step-1-5-demo','critesjosh/ace-step-music-studio']
          for sid in spaces:
              print('\n===== SPACE',sid,'=====')
              try:
                  c=Client(sid)
                  print('src',c.src)
                  for ep in c.endpoints.values():
                      print(getattr(ep,'fn_index',None), getattr(ep,'api_name',None), 'params', len(getattr(ep,'parameters_info',[]) or []))
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
          PY
      - name: Commit
        run: |
          git config user.name "Aura Music Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/hf_spaces/endpoints.txt
          git commit -m "Probe alternate ACE-Step Spaces" || exit 0
          git push
