name: Probe Alternate ACE-Step Spaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install --quiet --upgrade gradio_client
      - name: Probe endpoint schemas
        run: |
          mkdir -p generated/hf_spaces
          python - <<'PY' > generated/hf_spaces/endpoints.txt
          from gradio_client import Client
          spaces=['LububMusicAi/ACE-Step-Custom','WojteKris/ace-step-1-5-demo','critesjosh/ace-step-music-studio']
          for sid in spaces:
              print('\n===== SPACE',sid,'=====')
              try:
                  c=Client(sid)
                  print('src',c.src)
                  for ep in c.endpoints.values():
                      print(getattr(ep,'fn_index',None), getattr(ep,'api_name',None), 'params', len(getattr(ep,'parameters_info',[]) or []))
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
          PY
      - name: Upload probe result for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alternate-ace-step-space-probe
          path: generated/hf_spaces/endpoints.txt
          if-no-files-found: error
          retention-days: 14
