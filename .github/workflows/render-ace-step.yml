name: Render ACE-Step Backing Track

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_ace.py'
      - 'scripts/make_score_guide.py'
      - '.github/workflows/render-ace-step.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade gradio_client numpy soundfile

      - name: Build full 107-measure score guide
        id: guide
        run: |
          mkdir -p generated
          AURA_GUIDE=generated/full_score_guide.wav python scripts/make_score_guide.py | tee generated/guide_log.txt
          ffmpeg -y -hide_banner -loglevel error -i generated/full_score_guide.wav -t 30 generated/validation_source.wav
          ls -lh generated/full_score_guide.wav generated/validation_source.wav | tee -a generated/guide_log.txt

      - name: Neural render validation
        id: render
        continue-on-error: true
        env:
          AURA_SOURCE: generated/validation_source.wav
          AURA_OUTDIR: generated
          AURA_DURATION: '30'
          AURA_MODEL: acestep-v15-xl-turbo
          AURA_COVER_STRENGTH: '0.78'
        run: |
          set -o pipefail
          python scripts/render_ace.py 2>&1 | tee generated/render_log.txt

      - name: Record status
        if: always()
        run: |
          echo "guide=${{ steps.guide.outcome }}" > generated/render_status.txt
          echo "render=${{ steps.render.outcome }}" >> generated/render_status.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' >> generated/render_status.txt

      - name: Commit generated validation result and logs
        if: always()
        run: |
          git config user.name "Aura Music Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/
          git commit -m "ACE-Step score-guide neural render validation" || exit 0
          git push
