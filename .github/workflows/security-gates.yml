name: Elevate Souls Command Center Security Gates

on:
  push:
    branches: [main, development/full-site-build]
  pull_request:
    branches: [main, development/full-site-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-secrets:
    name: Committed secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full tracked tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan tracked files for production credentials
        run: python scripts/scan_committed_secrets.py --root .

      - name: Scanner regression tests
        run: python -m pip install pytest && python -m pytest -q tests/test_committed_secret_scan.py

  supply-chain:
    name: Dependency, SAST and SBOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application and security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install pip-audit bandit cyclonedx-bom

      - name: Audit installed Python dependencies
        run: pip-audit --local --progress-spinner off

      - name: Static application security scan
        run: bandit -q -r aura_music_studio -x tests -lll

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file chat10-sbom.cdx.json

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: command-center-python-sbom
          path: chat10-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  sls-release-trust:
    name: Elevate Souls Productions Secure Lattice System release trust gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install pytest cryptography

      - name: Verify signed-release and fail-closed readiness boundaries
        run: >-
          python -m pytest -q
          tests/test_aura_sec_release.py
          tests/test_aura_sec_release_key_trust.py
          tests/test_aura_sec_release_trust.py
          tests/test_aura_sec_platform_release.py
          tests/test_aura_sec_release_readiness.py

  sls-native-execution:
    name: Elevate Souls Productions Secure Lattice System native execution gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused native trust dependencies
        run: python -m pip install pytest cryptography 'pydantic>=2,<3' argon2-cffi

      - name: Verify signed sequence, exact command binding, device attestation, execute-once and native adapter boundaries
        run: >-
          python -m pytest -q
          tests/test_aura_sec_command_sequence.py
          tests/test_aura_sec_command_bound_attestation.py
          tests/test_aura_sec_device_attestation.py
          tests/test_aura_sec_native_execution_guard.py
          tests/test_aura_sec_native_platform_execution.py
