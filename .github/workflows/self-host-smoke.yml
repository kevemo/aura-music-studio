name: Command Center Self-Host Smoke

on:
  push:
    branches: [main, development/full-site-build]
  pull_request:
    branches: [main, development/full-site-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-self-host-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-host-smoke:
    name: Build and boot integrated base stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test configuration
        run: cp .env.example .env

      - name: Validate self-host topologies
        run: |
          docker compose config -q
          docker compose --profile public config -q
          docker compose --profile social-publishing config -q
          docker compose -f docker-compose.yml -f docker-compose.local-ai.yml config -q

      - name: Build and boot integrated base stack
        run: docker compose up -d --build

      - name: Wait for production application liveness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/live >/tmp/command-center-health.json; then
              cat /tmp/command-center-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Command Center did not become live within the smoke-test window" >&2
          docker compose ps >&2 || true
          docker compose logs --no-color --tail=250 >&2 || true
          exit 1

      - name: Verify all base services stay running
        run: |
          docker compose ps
          running="$(docker compose ps --services --status running)"
          for service in \
            live-sound-studio \
            aura-worker \
            aura-task-worker \
            aura-backup-scheduler \
            aura-address-manager \
            searxng
          do
            if ! printf '%s\n' "$running" | grep -Fxq "$service"; then
              echo "Required self-host service is not running: $service" >&2
              docker compose logs --no-color --tail=250 "$service" >&2 || true
              exit 1
            fi
          done

      - name: Verify unified production route surface
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=10) as response:
              schema = json.load(response)

          required = {
              '/health/live': {'get'},
              '/health/ready': {'get'},
              '/billing/stripe/checkout/marketplace': {'post'},
              '/aura-sec/overview': {'get'},
          }
          paths = schema.get('paths', {})
          missing = []
          for path, methods in required.items():
              actual = {name.lower() for name in paths.get(path, {})}
              for method in methods:
                  if method not in actual:
                      missing.append(f'{method.upper()} {path}')
          if missing:
              raise SystemExit('Unified production route surface missing: ' + ', '.join(missing))

          print(f"PASS: production entrypoint exposed {len(paths)} OpenAPI paths with required release routes including Aura Sec")
          PY

      - name: Capture self-host logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=500

      - name: Stop self-host stack
        if: always()
        run: docker compose down -v --remove-orphans
