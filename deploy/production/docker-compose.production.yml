name: aura-command-center-production

services:
  live-sound-studio:
    environment:
      AURA_DEPLOYMENT_ENV: production
      LSS_DEPLOYMENT_MODE: ${LSS_DEPLOYMENT_MODE:?LSS_DEPLOYMENT_MODE=selfhost is required}
      LSS_TRUSTED_PROXY_TOKEN: ${LSS_TRUSTED_PROXY_TOKEN:?LSS_TRUSTED_PROXY_TOKEN is required in production}
      AURA_GPU_REQUIRED: "true"
      AURA_REQUIRE_LIVE_RENDERER: "true"
      AURA_MONITORING_ENABLED: "true"
      LSS_COOKIE_SECURE: "true"
      AURA_WEB_ALLOW_HTTP: "false"
      LSS_AUTO_BACKUP_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 30s

  aura-worker:
    environment:
      AURA_DEPLOYMENT_ENV: production
      LSS_DEPLOYMENT_MODE: ${LSS_DEPLOYMENT_MODE:?LSS_DEPLOYMENT_MODE=selfhost is required}
      AURA_GPU_REQUIRED: "true"
      AURA_REQUIRE_LIVE_RENDERER: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  aura-task-worker:
    environment:
      AURA_DEPLOYMENT_ENV: production
      LSS_DEPLOYMENT_MODE: ${LSS_DEPLOYMENT_MODE:?LSS_DEPLOYMENT_MODE=selfhost is required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  aura-backup-scheduler:
    environment:
      AURA_DEPLOYMENT_ENV: production
      LSS_DEPLOYMENT_MODE: ${LSS_DEPLOYMENT_MODE:?LSS_DEPLOYMENT_MODE=selfhost is required}
      LSS_AUTO_BACKUP_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ace-step:
    environment:
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:?ACESTEP_API_KEY is required in production}
    shm_size: "8gb"
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  caddy:
    environment:
      LSS_PUBLIC_SITE_ADDRESS: ${LSS_PUBLIC_SITE_ADDRESS:?real production HTTPS site address is required}
      LSS_TRUSTED_PROXY_TOKEN: ${LSS_TRUSTED_PROXY_TOKEN:?LSS_TRUSTED_PROXY_TOKEN is required in production}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
