apiVersion: v1
kind: Namespace
metadata:
  name: esp-command-center
  labels:
    app.kubernetes.io/part-of: elevate-souls-command-center
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: esp-command-center
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: esp-command-center
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: esp-command-center
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Renderers are private: only Command Center pods may call ACE-Step.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ace-step-private-ingress
  namespace: esp-command-center
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ace-step
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: command-center
      ports:
        - protocol: TCP
          port: 8001
---
# Aura reasoning is likewise private. vLLM's own API key is defense in depth and must not
# be treated as the primary boundary because not every vLLM endpoint is key-protected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aura-llm-private-ingress
  namespace: esp-command-center
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aura-llm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: command-center
      ports:
        - protocol: TCP
          port: 8000
