services:
  live-sound-studio:
    environment:
      AURA_ACESTEP_API_URL: http://ace-step:8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      # Consumer-first defaults. Larger ESP nodes can select XL through .env without changing code.
      AURA_ACESTEP_FULL_MODEL: ${AURA_ACESTEP_FULL_MODEL:-acestep-v15-turbo}
      AURA_ACESTEP_TRACK_MODEL: ${AURA_ACESTEP_TRACK_MODEL:-acestep-v15-base}
      AURA_ACESTEP_SAMPLE_MODEL: ${AURA_ACESTEP_SAMPLE_MODEL:-acestep-v15-base}
      AURA_REQUIRE_LIVE_RENDERER: "true"
      AURA_RENDERER_SMOKE_STATUS: /app/data/renderer_smoke.json
    depends_on:
      ace-step:
        condition: service_healthy
      aura-renderer-smoke:
        condition: service_completed_successfully

  aura-worker:
    environment:
      AURA_ACESTEP_API_URL: http://ace-step:8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      AURA_ACESTEP_FULL_MODEL: ${AURA_ACESTEP_FULL_MODEL:-acestep-v15-turbo}
      AURA_ACESTEP_TRACK_MODEL: ${AURA_ACESTEP_TRACK_MODEL:-acestep-v15-base}
      AURA_ACESTEP_SAMPLE_MODEL: ${AURA_ACESTEP_SAMPLE_MODEL:-acestep-v15-base}
      AURA_REQUIRE_LIVE_RENDERER: "true"
      AURA_RENDERER_SMOKE_STATUS: /app/data/renderer_smoke.json
    depends_on:
      ace-step:
        condition: service_healthy
      aura-renderer-smoke:
        condition: service_completed_successfully

  ace-step:
    # Pinned to the ACE-Step 1.5 upstream commit reviewed by ESP. That revision includes the
    # complete/lego source-conditioning workaround needed by Build Around Upload.
    build:
      context: https://github.com/ace-step/ACE-Step-1.5.git#14c0211d5a0653b0f63e27686f4c3f151b4d8629
      dockerfile: Dockerfile
    container_name: live-sound-studio-ace-step
    restart: unless-stopped
    gpus: all
    environment:
      ACESTEP_MODE: api
      ACESTEP_API_HOST: 0.0.0.0
      ACESTEP_API_PORT: 8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      # The REST API uses ACESTEP_NO_INIT, not the Gradio-only ACESTEP_INIT_SERVICE flag.
      # Eager initialization makes HTTP health + the inference smoke gate meaningful at launch.
      ACESTEP_NO_INIT: "false"
      ACESTEP_CONFIG_PATH: ${AURA_ACESTEP_FULL_MODEL:-acestep-v15-turbo}
      ACESTEP_CONFIG_PATH2: ${AURA_ACESTEP_TRACK_MODEL:-acestep-v15-base}
      ACESTEP_LM_MODEL_PATH: ${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-0.6B}
      ACESTEP_LM_BACKEND: ${ACESTEP_LM_BACKEND:-pt}
      ACESTEP_QUEUE_WORKERS: "1"
      ACESTEP_QUEUE_MAXSIZE: ${ACESTEP_QUEUE_MAXSIZE:-100}
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    expose:
      - "8001"
    volumes:
      - ace_step_checkpoints:/app/checkpoints
      - ace_step_outputs:/app/output
      - ace_step_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 300s
    # Deliberately no public host port. Only The Live Sound Studio services call this worker.

  aura-renderer-smoke:
    build: .
    container_name: live-sound-studio-renderer-smoke
    restart: "no"
    command: ["python", "-m", "aura_music_studio.renderer_smoke"]
    env_file:
      - .env
    environment:
      AURA_ACESTEP_API_URL: http://ace-step:8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      AURA_ACESTEP_FULL_MODEL: ${AURA_ACESTEP_FULL_MODEL:-acestep-v15-turbo}
      AURA_ACESTEP_SMOKE_MODEL: ${AURA_ACESTEP_SMOKE_MODEL:-acestep-v15-turbo}
      AURA_RENDERER_SMOKE_SECONDS: ${AURA_RENDERER_SMOKE_SECONDS:-10}
      AURA_RENDERER_SMOKE_STEPS: ${AURA_RENDERER_SMOKE_STEPS:-4}
      AURA_RENDERER_SMOKE_TIMEOUT: ${AURA_RENDERER_SMOKE_TIMEOUT:-1200}
      AURA_RENDERER_SMOKE_STATUS: /app/data/renderer_smoke.json
    volumes:
      - live_sound_data:/app/data
    depends_on:
      ace-step:
        condition: service_healthy

volumes:
  ace_step_checkpoints:
  ace_step_outputs:
  ace_step_hf_cache:
