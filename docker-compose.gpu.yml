services:
  live-sound-studio:
    environment:
      AURA_ACESTEP_API_URL: http://ace-step:8001
      AURA_ACESTEP_FULL_MODEL: acestep-v15-turbo
      AURA_ACESTEP_TRACK_MODEL: acestep-v15-base
      AURA_ACESTEP_SAMPLE_MODEL: acestep-v15-base
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
    depends_on:
      ace-step:
        condition: service_healthy

  aura-worker:
    environment:
      AURA_ACESTEP_API_URL: http://ace-step:8001
      AURA_ACESTEP_FULL_MODEL: acestep-v15-turbo
      AURA_ACESTEP_TRACK_MODEL: acestep-v15-base
      AURA_ACESTEP_SAMPLE_MODEL: acestep-v15-base
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
    depends_on:
      ace-step:
        condition: service_healthy

  ace-step:
    # Official ACE-Step 1.5 REST worker pinned to the upstream commit reviewed by ESP.
    # Slot 1: Turbo full-song generation. Slot 2: Base Complete/Lego/Extract + deeper editing.
    build:
      context: https://github.com/ace-step/ACE-Step-1.5.git#14c0211d5a0653b0f63e27686f4c3f151b4d8629
      dockerfile: Dockerfile
    container_name: live-sound-studio-ace-step
    restart: unless-stopped
    gpus: all
    environment:
      ACESTEP_MODE: api
      ACESTEP_API_HOST: 0.0.0.0
      ACESTEP_API_PORT: 8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      ACESTEP_INIT_SERVICE: "true"
      ACESTEP_CONFIG_PATH: acestep-v15-turbo
      ACESTEP_CONFIG_PATH2: acestep-v15-base
      ACESTEP_LM_MODEL_PATH: ${AURA_ACESTEP_LM_MODEL:-acestep-5Hz-lm-1.7B}
      ACESTEP_LLM_BACKEND: ${AURA_ACESTEP_LLM_BACKEND:-pt}
      ACESTEP_OFFLOAD_TO_CPU: ${AURA_ACESTEP_OFFLOAD_TO_CPU:-false}
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    expose:
      - "8001"
    volumes:
      - ace_step_checkpoints:/app/checkpoints
      - ace_step_outputs:/app/output
      - ace_step_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    # No public host port. Only ESP Live Sound Studio services can reach the neural renderer.

volumes:
  ace_step_checkpoints:
  ace_step_outputs:
  ace_step_hf_cache:
