services:
  live-sound-studio:
    build: .
    container_name: live-sound-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AURA_PROJECTS_ROOT: /app/projects
      LSS_DB_PATH: /app/data/live_sound_studio.sqlite3
      AURA_WEB_ENABLED: "true"
      AURA_SEARXNG_URL: http://searxng:8080
    ports:
      - "8000:8000"
    volumes:
      - live_sound_data:/app/data
      - live_sound_projects:/app/projects
    depends_on:
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: live-sound-studio-search
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    # Deliberately no host `ports:` mapping. Aura can reach this service over the private
    # Compose network, while members cannot use the metasearch instance as an open proxy.

volumes:
  live_sound_data:
  live_sound_projects:
