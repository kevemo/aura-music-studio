services:
  live-sound-studio:
    build: .
    container_name: live-sound-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AURA_PROJECTS_ROOT: /app/projects
      LSS_DB_PATH: /app/data/live_sound_studio.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - live_sound_data:/app/data
      - live_sound_projects:/app/projects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  live_sound_data:
  live_sound_projects:
