[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Retained as a compatibility distribution identifier. The authoritative public
# product brand is Elevate Souls Productions Content Creation Command Center.
name = "aura-music-studio"
version = "0.20.0"
description = "Elevate Souls Productions Content Creation Command Center — professional music, video, image, voice and creator intelligence — Powered by Rhiannon Intelligence Systems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "gradio>=5.0",
  "gradio-client>=1.7",
  "typer>=0.12",
  "rich>=13.7",
  "music21>=9.1",
  "mido>=1.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyloudnorm>=0.1.1",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "Pillow>=10.4"
]

[project.optional-dependencies]
