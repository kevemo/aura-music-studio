[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-music-studio"
version = "0.2.0"
description = "Autonomous score/reference-driven AI music production studio"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "gradio>=5.0",
  "gradio-client>=1.7",
  "typer>=0.12",
  "rich>=13.7",
  "music21>=9.1",
  "mido>=1.3"
]

[project.optional-dependencies]
stems = ["demucs>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
aura = "aura_music_studio.cli:app"

[tool.setuptools.packages.find]
include = ["aura_music_studio*"]

[tool.ruff]
line-length = 100
