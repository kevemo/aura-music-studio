[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Retained as a compatibility distribution identifier. The authoritative public
# product brand is Elevate Souls Productions Content Creation Command Center.
name = "aura-music-studio"
version = "0.20.0"
description = "Elevate Souls Productions Content Creation Command Center — professional music, video, image, voice and creator intelligence — Powered by Aura AI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "gradio>=5.0",
  "gradio-client>=1.7",
  "typer>=0.12",
  "rich>=13.7",
  "music21>=9.1",
  "mido>=1.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyloudnorm>=0.1.1",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "Pillow>=10.4"
]

[project.optional-dependencies]
stems = [
  "demucs>=4.0",
  "audio-separator>=0.44"
]
transcription = [
  "basic-pitch>=0.4"
]
mastering = [
  "matchering>=2.0"
]
selfhost = [
  "miniupnpc>=2.3"
]
voice = []
local-ai = []
all-audio = [
  "demucs>=4.0",
  "audio-separator>=0.44",
  "basic-pitch>=0.4",
  "matchering>=2.0"
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
aura = "aura_music_studio.cli:app"
aura-task-worker = "aura_music_studio.aura_task_worker:run_worker"
aura-social-publish-worker = "aura_music_studio.esp_social_publish_worker:run_worker"
shared-sky-worker = "aura_music_studio.shared_sky_worker:run_worker"
shared-sky-battle-worker = "aura_music_studio.shared_sky_battle_worker:run_worker"

[tool.setuptools.packages.find]
include = ["aura_music_studio*"]

[tool.setuptools.package-data]
aura_music_studio = ["static/*.webp", "static/*.svg"]

[tool.ruff]
line-length = 100
